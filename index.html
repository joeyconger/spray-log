// ── Storage ───────────────────────────────────────────────────────────────────
function useLocalStorage(key, init) {
  const [val, setVal] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; } catch { return init; }
  });
  const set = (v) => { setVal(v); try { localStorage.setItem(key, JSON.stringify(v)); } catch {} };
  return [val, set];
}

// ── Weather (free, no key needed) ─────────────────────────────────────────────
function parseHour(timeStr) {
  if (!timeStr) return 10;
  const m = timeStr.trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);
  if (!m) return 10;
  let h = parseInt(m[1]);
  const ap = (m[3]||"").toUpperCase();
  if (ap==="PM" && h!==12) h+=12;
  if (ap==="AM" && h===12) h=0;
  return Math.min(Math.max(h,0),23);
}

async function geocodeAddress(address) {
  try {
    const q = encodeURIComponent(address + ", Tulsa, OK, USA");
    const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1`,
      { headers:{ "User-Agent":"SprayLogApp/1.0","Accept-Language":"en" } });
    const d = await r.json();
    if (d&&d[0]) return { lat:parseFloat(d[0].lat), lon:parseFloat(d[0].lon) };
  } catch(e) { console.warn("Geocode failed:",e); }
  return { lat:36.1540, lon:-95.9928 };
}

async function fetchWeatherForDate(lat, lon, dateStr, timeStr) {
  const jobDate = new Date(dateStr+"T12:00:00");
  const today   = new Date(); today.setHours(0,0,0,0);
  const base    = jobDate < today
    ? "https://archive-api.open-meteo.com/v1/archive"
    : "https://api.open-meteo.com/v1/forecast";
  const url = `${base}?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,windspeed_10m,winddirection_10m,cloudcover&temperature_unit=fahrenheit&windspeed_unit=mph&timezone=America%2FChicago&start_date=${dateStr}&end_date=${dateStr}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`Weather API ${r.status}`);
  const d = await r.json();
  if (d.error) throw new Error("Weather: "+d.reason);
  const hour = parseHour(timeStr);
  const temp = d.hourly?.temperature_2m?.[hour];
  const wind = d.hourly?.windspeed_10m?.[hour];
  const wdDeg= d.hourly?.winddirection_10m?.[hour];
  const cloud= d.hourly?.cloudcover?.[hour];
  if (temp==null) throw new Error("No weather data for that hour");
  const dirs   = ["N","NE","E","SE","S","SW","W","NW"];
  const compass= dirs[Math.round((wdDeg||0)/45)%8]||"N";
  let sky="Clear";
  if (cloud>70) sky="Cloudy"; else if (cloud>25) sky="Partly Cloudy";
  return { temp:Math.round(temp), wind:Math.min(Math.round(wind||0),9), windDir:compass, sky };
}

// ── File text extraction (no API needed) ──────────────────────────────────────
async function extractTextFromFile(file) {
  const ext = file.name.split(".").pop().toLowerCase();
  if (ext==="docx") {
    const ab  = await file.arrayBuffer();
    const res = await mammoth.extractRawText({ arrayBuffer:ab });
    return res.value||"";
  }
  if (ext==="pdf") {
    // For PDF we use the browser's built-in fetch + pdf.js via CDN
    return null; // signals "use manual entry"
  }
  throw new Error("Only .docx and .pdf supported");
}

function printHTML(html) {
  const w = window.open("","_blank");
  if (!w) { alert("Allow pop-ups to print."); return; }
  w.document.write(html); w.document.close(); w.focus();
  setTimeout(()=>w.print(),600);
}

// ── Upload Tab ────────────────────────────────────────────────────────────────
// No AI needed — paste text and we parse it client-side with simple rules,
// OR manually enter jobs one by one.
function parseJobsFromText(text) {
  // Skip header/junk lines
  const SKIP = /^(maintenance trails|date|name|address|miles|linear feet|linear ft|acreage|\d+|\s*✕\s*)$/i;
  // Address: starts with a number followed by letters (street address)
  const IS_ADDR = /^\d+\s+[a-z]/i;
  // Number-only (miles or linear feet): decimal or integer
  const IS_NUM = /^\d+(\.\d+)?$/;

  const raw = text.split(/\n/).map(l => l.replace(/\t.*/, "").trim()).filter(l => l && !SKIP.test(l));

  const jobs = [];
  let i = 0;
  while (i < raw.length) {
    const line = raw[i];
    // A job name: not an address, not a pure number, has letters, at least 3 chars
    const isName = !IS_ADDR.test(line) && !IS_NUM.test(line) && /[a-zA-Z]/.test(line) && line.length >= 3;
    if (!isName) { i++; continue; }

    const job = { code:"", name:line, address:"", miles:"", linearFeet:"", acreage:"" };
    i++;

    // Next line: address?
    if (i < raw.length && IS_ADDR.test(raw[i])) { job.address = raw[i]; i++; }
    // Next line: miles (small decimal)?
    if (i < raw.length && IS_NUM.test(raw[i]) && parseFloat(raw[i]) < 50) { job.miles = raw[i]; i++; }
    // Next line: linear feet (larger number)?
    if (i < raw.length && IS_NUM.test(raw[i])) { job.linearFeet = raw[i]; i++; }

    jobs.push(job);
  }
  return jobs;
}

function UploadTab({jobLists, setJobLists}) {
  const [selectedList, setSelectedList] = useState(LISTS[0]);
  const [mode, setMode]         = useState("paste"); // "paste" | "manual"
  const [pasteText, setPasteText] = useState("");
  const [status, setStatus]     = useState("");
  const [dragOver, setDragOver] = useState(false);
  const [loading, setLoading]   = useState(false);
  const fileRef = useRef();

  // Manual entry state
  const blankJob = {code:"",name:"",address:"",miles:"",linearFeet:"",acreage:""};
  const [draft, setDraft] = useState(blankJob);

  const counts = Object.fromEntries(LISTS.map(l=>[l,(jobLists[l]||[]).length]));

  // ── File drop/upload: extract text then put in paste box
  const handleFile = async (file) => {
    if (!file) return;
    const ext = file.name.split(".").pop().toLowerCase();
    if (!["docx","pdf","txt"].includes(ext)) { setStatus("❌ Use .docx, .pdf, or .txt"); return; }
    setLoading(true); setStatus("Extracting text…");
    try {
      if (ext==="docx") {
        const ab  = await file.arrayBuffer();
        const res = await mammoth.extractRawText({arrayBuffer:ab});
        setPasteText(res.value||"");
        setMode("paste");
        setStatus("✅ Text extracted — review below then click Parse & Save");
      } else if (ext==="pdf") {
        setStatus("⚠️ PDF text extraction not supported without API. Copy-paste the text from your PDF instead, or use a .docx file.");
      } else {
        const txt = await file.text();
        setPasteText(txt);
        setMode("paste");
        setStatus("✅ File loaded — review then click Parse & Save");
      }
    } catch(e) { setStatus("❌ "+e.message); }
    setLoading(false);
  };

  const parsePaste = () => {
    if (!pasteText.trim()) return;
    const parsed = parseJobsFromText(pasteText);
    if (!parsed.length) { setStatus("❌ Couldn't find any jobs — check the format"); return; }
    setJobLists({...jobLists,[selectedList]:parsed});
    setStatus(`✅ Saved ${parsed.length} jobs to "${selectedList}"`);
    setPasteText("");
  };

  const addManual = () => {
    if (!draft.name.trim()) { setStatus("⚠️ Name is required"); return; }
    const updated = [...(jobLists[selectedList]||[]), draft];
    setJobLists({...jobLists,[selectedList]:updated});
    setDraft(blankJob);
    setStatus(`✅ Added "${draft.name}"`);
  };

  return (
    <div>
      <h3 style={{color:"#2d5a1b",marginTop:0}}>Manage Job Lists</h3>
      <p style={{fontSize:13,color:"#666",marginTop:0}}>No API key needed — paste your list text or add jobs manually.</p>

      <div style={{marginBottom:16}}>
        <div style={{fontSize:11,fontWeight:700,color:"#555",textTransform:"uppercase",letterSpacing:.4,marginBottom:8}}>Which list?</div>
        <ListPicker value={selectedList} onChange={setSelectedList} counts={counts}/>
      </div>

      {/* Mode switcher */}
      <div style={{display:"flex",gap:8,marginBottom:20}}>
        {["paste","manual"].map(m=>(
          <button key={m} onClick={()=>setMode(m)} style={{
            padding:"6px 16px",border:"1.5px solid #2d5a1b",borderRadius:5,fontSize:12,
            background:mode===m?"#2d5a1b":"#fff",color:mode===m?"#fff":"#2d5a1b",fontWeight:mode===m?700:400
          }}>{m==="paste"?"📋 Paste / Upload Text":"✏️ Add Manually"}</button>
        ))}
      </div>

      {mode==="paste" && (
        <div>
          {/* Drop zone */}
          <div
            onDragOver={e=>{e.preventDefault();setDragOver(true)}}
            onDragLeave={()=>setDragOver(false)}
            onDrop={e=>{e.preventDefault();setDragOver(false);handleFile(e.dataTransfer.files[0])}}
            onClick={()=>!loading&&fileRef.current.click()}
            style={{
              border:`2px dashed ${dragOver?"#2d5a1b":"#ccc"}`,borderRadius:10,
              padding:"20px",textAlign:"center",cursor:loading?"wait":"pointer",
              background:dragOver?"#f0f7eb":"#fafafa",marginBottom:12,transition:"all .2s"
            }}>
            <span style={{fontSize:22}}>📄</span>
            <div style={{fontSize:13,color:"#888",marginTop:4}}>
              {loading?"Extracting…":"Drop a .docx or .txt file here to auto-fill, or click to browse"}
            </div>
            <input ref={fileRef} type="file" accept=".docx,.txt" style={{display:"none"}}
              onChange={e=>handleFile(e.target.files[0])}/>
          </div>

          <div style={{fontSize:12,color:"#888",marginBottom:6}}>
            Or paste your job list text directly (one job per line, columns separated by tabs):
          </div>
          <textarea value={pasteText} onChange={e=>setPasteText(e.target.value)}
            placeholder={"Code\tName\tAddress\tMiles\tLinear Ft\tAcreage\nAL001\tAaronson\t5000 S 87th E Ave\t0.59\t3115\t"}
            style={{width:"100%",height:180,padding:10,border:"1px solid #bbb",borderRadius:6,
              fontSize:12,fontFamily:"monospace",boxSizing:"border-box",resize:"vertical"}}/>
          <div style={{display:"flex",gap:10,marginTop:8}}>
            <button onClick={parsePaste} disabled={!pasteText.trim()} style={{
              padding:"8px 20px",background:"#2d5a1b",color:"#fff",border:"none",
              borderRadius:6,fontSize:13,fontWeight:600,opacity:pasteText.trim()?1:.5
            }}>Parse & Save</button>
            <button onClick={()=>setPasteText("")}
              style={{padding:"8px 14px",background:"#fff",color:"#c0392b",border:"1.5px solid #c0392b",borderRadius:6,fontSize:13}}>
              Clear
            </button>
          </div>
        </div>
      )}

      {mode==="manual" && (
        <div style={{border:"1px solid #ddd",borderRadius:8,padding:16,background:"#fafafa"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 16px"}}>
            {[["name","Name *"],["address","Address"],["code","Code"],["miles","Miles"],["linearFeet","Linear Feet"],["acreage","Acreage"]].map(([k,l])=>(
              <div key={k} style={{marginBottom:10}}>
                <label style={{fontSize:11,fontWeight:700,color:"#555",textTransform:"uppercase",letterSpacing:.4,display:"block",marginBottom:3}}>{l}</label>
                <input value={draft[k]} onChange={e=>setDraft(d=>({...d,[k]:e.target.value}))}
                  style={{width:"100%",padding:"7px 10px",border:"1px solid #bbb",borderRadius:5,fontSize:13}}/>
              </div>
            ))}
          </div>
          <button onClick={addManual} style={{
            padding:"8px 20px",background:"#2d5a1b",color:"#fff",border:"none",
            borderRadius:6,fontSize:13,fontWeight:600,marginTop:4
          }}>+ Add Job</button>
        </div>
      )}

      {status && <p style={{fontSize:13,margin:"12px 0 0",color:status.startsWith("✅")?"#2d5a1b":status.startsWith("⚠️")?"#e67e22":"#c0392b"}}>{status}</p>}

      {/* Stored lists preview */}
      <h4 style={{color:"#2d5a1b",margin:"20px 0 10px",fontSize:13}}>Stored Lists</h4>
      {LISTS.map(l=>{
        const jobs=jobLists[l]||[];
        return (
          <div key={l} style={{marginBottom:8,border:"1px solid #ddd",borderRadius:7,overflow:"hidden"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:"#e8f0e2"}}>
              <span style={{fontWeight:700,fontSize:13,color:"#2d5a1b"}}>{l}</span>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <span style={{fontSize:12,color:"#555"}}>{jobs.length} jobs</span>
                {jobs.length>0&&<button onClick={()=>{if(confirm(`Clear "${l}"?`))setJobLists({...jobLists,[l]:[]})}}
                  style={{fontSize:11,color:"#c0392b",background:"none",border:"1px solid #e0c0c0",borderRadius:4,padding:"2px 7px"}}>Clear</button>}
              </div>
            </div>
            {jobs.length>0&&(
              <div style={{maxHeight:120,overflowY:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                  <tbody>
                    {jobs.map((j,i)=>(
                      <tr key={i} style={{background:i%2===0?"#fff":"#f9fbf7",borderBottom:"1px solid #f0f0f0"}}>
                        <td style={{padding:"4px 10px",color:"#aaa",width:24}}>{i+1}</td>
                        <td style={{padding:"4px 8px",fontWeight:600}}>{j.name}</td>
                        <td style={{padding:"4px 8px",color:"#666"}}>{j.address}</td>
                        <td style={{padding:"4px 8px",color:"#999",whiteSpace:"nowrap"}}>{j.miles?`${j.miles} mi`:j.acreage?`${j.acreage} ac`:""}</td>
                        <td style={{padding:"4px 8px",textAlign:"right"}}>
                          <button onClick={()=>{
                            const updated=(jobLists[l]||[]).filter((_,idx)=>idx!==i);
                            setJobLists({...jobLists,[l]:updated});
                          }} style={{fontSize:10,color:"#c0392b",background:"none",border:"none",cursor:"pointer",padding:"0 4px"}}>✕</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── Jobs Tab ──────────────────────────────────────────────────────────────────
function JobsTab({jobLists,chemDefaults,completedLogs,setCompletedLogs}) {
  const [listName, setListName] = useState(LISTS[0]);
  const [search, setSearch]     = useState("");
  const [panel, setPanel]       = useState(null);
  // pendingLog: array of { jobIdx, job, weather } in list order
  const [pendingLog, setPendingLog] = useState([]);

  const jobs     = jobLists[listName]||[];
  const isTAC100 = listName==="TAC 100";
  const filtered = search.trim()
    ? jobs.filter(j=>
        j.name?.toLowerCase().includes(search.toLowerCase())||
        j.code?.toLowerCase().includes(search.toLowerCase())||
        j.address?.toLowerCase().includes(search.toLowerCase()))
    : jobs;

  // Keep pending sorted by original list order
  const sortedPending = [...pendingLog].sort((a,b)=>a.jobIdx-b.jobIdx);

  const lastDateRef = useRef(new Date().toISOString().slice(0,10));

  const openJob = (idx) => {
    if (panel?.jobIdx===idx) { setPanel(null); return; }
    setPanel({ jobIdx:idx, date:lastDateRef.current, timeStart:"", timeEnd:"", weather:null, status:"", loading:false });
  };

  // Parse "10:49 AM - 11:30 AM" or "10:49-11:30" into {start, end}
  const parseTimeInput = (val) => {
    const sep = val.match(/[-–—to]+/i);
    if (sep) {
      const parts = val.split(/\s*[-–—]\s*|(\s+to\s+)/i).filter(p=>p&&!/^\s+to\s+$/i.test(p));
      return { start: parts[0]?.trim()||"", end: parts[1]?.trim()||"" };
    }
    return { start: val.trim(), end: "" };
  };

  const doFetch = async () => {
    if (!panel.timeStart||!panel.date) { setPanel(p=>({...p,status:"⚠️ Enter a start time first"})); return; }
    lastDateRef.current = panel.date;
    setPanel(p=>({...p,loading:true,weather:null,status:"Locating address…"}));
    try {
      const job = jobs[panel.jobIdx];
      const {lat,lon} = await geocodeAddress(job.address);
      setPanel(p=>({...p,status:"Fetching weather…"}));
      const weather = await fetchWeatherForDate(lat,lon,panel.date,panel.timeStart);
      setPanel(p=>({...p,loading:false,weather,status:""}));
    } catch(e) {
      setPanel(p=>({...p,loading:false,status:"❌ "+e.message}));
    }
  };

  const doAddToLog = () => {
    const job = {...jobs[panel.jobIdx],date:panel.date,timeStart:panel.timeStart,timeEnd:panel.timeEnd};
    const w   = panel.weather;
    // Remove existing entry for this job if re-adding, then add fresh
    const filtered2 = pendingLog.filter(e=>e.jobIdx!==panel.jobIdx);
    setPendingLog([...filtered2, {jobIdx:panel.jobIdx, job, weather:w}]);
    setPanel(null);
  };

  const removeFromLog = (jobIdx) => {
    setPendingLog(pendingLog.filter(e=>e.jobIdx!==jobIdx));
  };

  const doPrintLog = () => {
    if (!sortedPending.length) return;
    const chem = chemDefaults[listName]||DEFAULT_CHEM[listName];
    printHTML(buildTrailsLogHTML(sortedPending.map(e=>({job:e.job,weather:e.weather})), listName));
    if (isTAC100) {
      setTimeout(()=>{
        sortedPending.forEach((e,i)=>{
          setTimeout(()=>printHTML(buildPesticideHTML(e.job,e.weather,chem)), i*800);
        });
      }, 800);
    }
    // Save all to completed logs
    const newLogs = sortedPending.map(e=>({
      id: Date.now()+e.jobIdx,
      listName, job:e.job, weather:e.weather, chem,
      trailsHTML: buildTrailsLogHTML([{job:e.job,weather:e.weather}], listName),
      pesticideHTML: isTAC100?buildPesticideHTML(e.job,e.weather,chem):null,
      createdAt: new Date().toLocaleString(),
    }));
    setCompletedLogs([...newLogs,...completedLogs]);
    setPendingLog([]);
  };

  const counts = Object.fromEntries(LISTS.map(l=>[l,(jobLists[l]||[]).length]));

  return (
    <div>
      <div style={{marginBottom:16}}>
        <ListPicker value={listName} onChange={l=>{setListName(l);setPanel(null);setSearch("");}} counts={counts}/>
      </div>

      {/* Pending log bar */}
      {pendingLog.length>0&&(
        <div style={{background:"#e8f0e2",border:"1px solid #b5d4a0",borderRadius:8,padding:"10px 14px",marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={{fontWeight:700,fontSize:13,color:"#2d5a1b"}}>{pendingLog.length} job{pendingLog.length!==1?"s":""} in today's log</span>
            <button onClick={doPrintLog} style={{
              padding:"7px 18px",background:"#1a3d6e",color:"#fff",border:"none",
              borderRadius:6,fontSize:12,fontWeight:700,cursor:"pointer"
            }}>🖨 Print {isTAC100?"Log + Application Records":"Log"}</button>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:4}}>
            {sortedPending.map(e=>(
              <div key={e.jobIdx} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#fff",borderRadius:5,padding:"6px 10px",fontSize:12}}>
                <div>
                  <strong>{e.job.name}</strong>
                  <span style={{color:"#888",marginLeft:8}}>{e.job.timeStart}{e.job.timeEnd?` – ${e.job.timeEnd}`:""}</span>
                  <span style={{marginLeft:8,fontSize:11,color:"#2d5a1b"}}>
                    {e.weather?.sky==="Clear"?"☀️":e.weather?.sky==="Partly Cloudy"?"⛅":"☁️"} {e.weather?.temp}°F · {e.weather?.wind}mph {e.weather?.windDir}
                  </span>
                </div>
                <button onClick={()=>removeFromLog(e.jobIdx)} style={{background:"none",border:"none",color:"#c0392b",fontSize:13,padding:"0 4px",cursor:"pointer"}}>✕</button>
              </div>
            ))}
          </div>
        </div>
      )}

      {jobs.length===0 ? (
        <div style={{padding:40,textAlign:"center",color:"#aaa",border:"2px dashed #ddd",borderRadius:10}}>
          <div style={{fontSize:32,marginBottom:8}}>📋</div>
          <div style={{fontWeight:600,marginBottom:4}}>No jobs in {listName}</div>
          <div style={{fontSize:12}}>Go to the Upload tab to add jobs</div>
        </div>
      ) : (
        <div style={{display:"grid",gridTemplateColumns:panel?"1fr 340px":"1fr",gap:16,alignItems:"start"}}>

          {/* Job list */}
          <div>
            <input value={search} onChange={e=>setSearch(e.target.value)}
              placeholder="Search by name, code, or address…"
              style={{width:"100%",padding:"8px 12px",border:"1px solid #ccc",borderRadius:7,fontSize:13,marginBottom:8}}/>
            <div style={{fontSize:11,color:"#aaa",marginBottom:6}}>{filtered.length} job{filtered.length!==1?"s":""} · click to log</div>
            <div style={{display:"flex",flexDirection:"column",gap:4,maxHeight:560,overflowY:"auto",paddingRight:4}}>
              {filtered.map(job=>{
                const idx=jobs.indexOf(job);
                const isActive=panel?.jobIdx===idx;
                const wasLogged=completedLogs.some(l=>l.listName===listName&&l.job.name===job.name);
                return (
                  <div key={idx} onClick={()=>openJob(idx)} style={{
                    padding:"10px 14px",borderRadius:7,cursor:"pointer",transition:"all .12s",
                    border:`1.5px solid ${isActive?"#2d5a1b":wasLogged?"#b5d4a0":"#e0e0e0"}`,
                    background:isActive?"#2d5a1b":wasLogged?"#f4faf0":"#fff",
                  }}>
                    <div style={{fontWeight:600,fontSize:13,color:isActive?"#fff":"#1a1a1a"}}>{job.name}</div>
                    <div style={{fontSize:11,color:isActive?"#b5d4a0":"#999",marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                      {job.address}{job.miles?` · ${job.miles} mi`:""}{job.acreage?` · ${job.acreage} ac`:""}
                    </div>
                    {wasLogged&&!isActive&&<div style={{fontSize:10,color:"#2d5a1b",marginTop:2,fontWeight:600}}>✓ previously logged</div>}
                  </div>
                );
              })}
            </div>
          </div>

          {/* Side panel */}
          {panel&&(()=>{
            const job=jobs[panel.jobIdx];
            const canFetch=!!panel.timeStart&&!!panel.date&&!panel.loading;
            return (
              <div style={{border:"2px solid #2d5a1b",borderRadius:10,padding:18,background:"#f9fcf7",position:"sticky",top:16}}>
                <div style={{fontWeight:700,fontSize:15,color:"#2d5a1b",marginBottom:2}}>{job.name}</div>
                <div style={{fontSize:12,color:"#777",marginBottom:16}}>{job.address}</div>

                {/* Date */}
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:11,fontWeight:700,color:"#555",textTransform:"uppercase",letterSpacing:.4,marginBottom:4}}>Date</div>
                  <input type="date" value={panel.date}
                    onChange={e=>{
                      lastDateRef.current=e.target.value;
                      setPanel(p=>({...p,date:e.target.value,weather:null,status:""}));
                    }}
                    style={{width:"100%",padding:"7px 10px",border:"1px solid #bbb",borderRadius:5,fontSize:13}}/>
                </div>

                {/* Time — single line, supports "10:49 AM - 11:30 AM" */}
                <div style={{marginBottom:14}}>
                  <div style={{fontSize:11,fontWeight:700,color:"#555",textTransform:"uppercase",letterSpacing:.4,marginBottom:4}}>
                    Time &nbsp;<span style={{fontSize:10,color:"#aaa",fontWeight:400}}>start or "10:49 AM - 11:30 AM" · Enter to fetch</span>
                  </div>
                  <input value={panel.timeRaw||""} placeholder="10:49 AM - 11:30 AM"
                    onChange={e=>{
                      const raw=e.target.value;
                      const {start,end}=parseTimeInput(raw);
                      setPanel(p=>({...p,timeRaw:raw,timeStart:start,timeEnd:end,weather:null,status:""}));
                    }}
                    onKeyDown={e=>{if(e.key==="Enter")doFetch();}}
                    style={{width:"100%",padding:"7px 10px",border:"1px solid #bbb",borderRadius:5,fontSize:13}}/>
                </div>

                {panel.loading&&<div style={{textAlign:"center",padding:"10px 0",fontSize:13,color:"#888",fontStyle:"italic"}}>{panel.status||"Working…"}</div>}
                {!panel.loading&&panel.status&&<p style={{fontSize:12,color:panel.status.startsWith("❌")||panel.status.startsWith("⚠️")?"#c0392b":"#2d5a1b",margin:"0 0 12px"}}>{panel.status}</p>}

                {panel.weather&&<WeatherBox weather={panel.weather}/>}

                {!panel.weather&&!panel.loading&&(
                  <button onClick={doFetch} disabled={!canFetch} style={{
                    width:"100%",padding:"10px",marginBottom:8,
                    background:canFetch?"#2d5a1b":"#ccc",color:"#fff",border:"none",borderRadius:7,
                    fontSize:13,fontWeight:600,cursor:canFetch?"pointer":"not-allowed"
                  }}>⛅ Fetch Weather</button>
                )}

                {panel.weather&&!panel.loading&&(
                  <button onClick={doFetch} style={{
                    width:"100%",padding:"6px",marginBottom:8,background:"none",
                    border:"1px solid #b5d4a0",borderRadius:6,fontSize:11,color:"#2d5a1b",cursor:"pointer"
                  }}>↺ Re-fetch weather</button>
                )}

                {panel.weather&&(
                  <>
                    <button onClick={doAddToLog} style={{
                      width:"100%",padding:"11px",background:"#2d5a1b",color:"#fff",border:"none",
                      borderRadius:7,fontSize:13,fontWeight:700,cursor:"pointer",letterSpacing:.3,marginBottom:6
                    }}>+ Add to Log</button>
                    <div style={{fontSize:11,color:"#aaa",textAlign:"center"}}>
                      Job will be added to today's log in list order
                    </div>
                  </>
                )}

                <button onClick={()=>setPanel(null)} style={{width:"100%",marginTop:10,padding:"7px",background:"none",border:"1px solid #ddd",borderRadius:7,fontSize:12,color:"#aaa",cursor:"pointer"}}>✕ Close</button>
              </div>
            );
          })()}
        </div>
      )}
    </div>
  );
}

// ── Saved Logs ────────────────────────────────────────────────────────────────
function LogsTab({completedLogs,setCompletedLogs}) {
  const [filter,setFilter]=useState("All");
  const shown=filter==="All"?completedLogs:completedLogs.filter(l=>l.listName===filter);
  return (
    <div>
      <h3 style={{color:"#2d5a1b",marginTop:0}}>Saved Logs ({completedLogs.length})</h3>
      <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
        {["All",...LISTS].map(l=>(
          <button key={l} onClick={()=>setFilter(l)} style={{
            padding:"5px 12px",border:"1.5px solid #2d5a1b",borderRadius:5,
            background:filter===l?"#2d5a1b":"#fff",color:filter===l?"#fff":"#2d5a1b",
            fontWeight:filter===l?700:400,fontSize:12
          }}>{l}</button>
        ))}
      </div>
      {shown.length===0&&<p style={{color:"#aaa",fontSize:13}}>No logs saved yet.</p>}
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {shown.map(log=>(
          <div key={log.id} style={{border:"1px solid #ddd",borderRadius:8,padding:"12px 16px",background:"#fff"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}}>
              <div style={{flex:1}}>
                <strong style={{fontSize:14}}>{log.job.name}</strong>
                <span style={{marginLeft:8,fontSize:11,background:"#e8f0e2",color:"#2d5a1b",padding:"2px 7px",borderRadius:10,fontWeight:700}}>{log.listName}</span>
                <div style={{fontSize:12,color:"#666",marginTop:3}}>{log.job.date} · {log.job.timeStart}{log.job.timeEnd?` – ${log.job.timeEnd}`:""}</div>
                <div style={{fontSize:12,color:"#888"}}>{log.job.address}</div>
                <div style={{fontSize:12,marginTop:3}}>{log.weather?.sky==="Clear"?"☀️":log.weather?.sky==="Partly Cloudy"?"⛅":"☁️"} {log.weather?.sky}, {log.weather?.temp}°F, {log.weather?.wind} mph {log.weather?.windDir}</div>
              </div>
              <div style={{display:"flex",gap:6,flexShrink:0,alignItems:"center",flexWrap:"wrap"}}>
                <button onClick={()=>printHTML(log.trailsHTML)} style={{padding:"5px 10px",background:"#2d5a1b",color:"#fff",border:"none",borderRadius:5,fontSize:11}}>Log</button>
                {log.pesticideHTML&&<button onClick={()=>printHTML(log.pesticideHTML)} style={{padding:"5px 10px",background:"#1a3d6e",color:"#fff",border:"none",borderRadius:5,fontSize:11}}>Application</button>}
                <button onClick={()=>{if(confirm("Delete?"))setCompletedLogs(completedLogs.filter(l=>l.id!==log.id))}}
                  style={{padding:"5px 8px",background:"none",color:"#c0392b",border:"1px solid #e0c0c0",borderRadius:5,fontSize:11}}>✕</button>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Chemicals ─────────────────────────────────────────────────────────────────
function ChemTab({chemDefaults,setChemDefaults}) {
  const [listName,setListName]=useState("TAC 100");
  const chem=chemDefaults[listName]||DEFAULT_CHEM[listName];
  const update=(f,v)=>setChemDefaults({...chemDefaults,[listName]:{...chem,[f]:v}});
  const fields=[
    ["pesticide","Pesticide Applied"],["tradeName","Trade Name"],["manufacturer","Manufacturer"],
    ["tankConc","Tank Mix Concentration"],["epaReg","EPA Reg No."],["epaEst","EPA Est No."],
    ["applicatorType","Type of Applicator"],["ratePerAcre","Rate of Application (per acre)"],
    ["gallonsMixture","Gallons of Mixture"],["amountApplied","Amount Applied"],["rateCarrier","Rate of Carrier"],
  ];
  return (
    <div>
      <h3 style={{color:"#2d5a1b",marginTop:0}}>Chemical Defaults</h3>
      <p style={{fontSize:13,color:"#666",marginTop:0}}>TAC 100 uses these for the Pesticide Application Record.</p>
      <div style={{marginBottom:20}}><ListPicker value={listName} onChange={setListName}/></div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 20px"}}>
        {fields.map(([key,label])=>(
          <div key={key} style={{display:"flex",flexDirection:"column",gap:3,marginBottom:12}}>
            <label style={{fontSize:11,fontWeight:700,color:"#555",textTransform:"uppercase",letterSpacing:.4}}>{label}</label>
            <input value={chem[key]||""} onChange={e=>update(key,e.target.value)}
              style={{padding:"7px 10px",border:"1px solid #bbb",borderRadius:5,fontSize:13}}/>
          </div>
        ))}
      </div>
      <p style={{fontSize:12,color:"#2d5a1b"}}>✅ Saves automatically.</p>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [tab,setTab]=useState("Jobs");
  const [jobLists,setJobLists]           = useLocalStorage("spraylog_jobs",  {[LISTS[0]]:[],[LISTS[1]]:[],[LISTS[2]]:[],[LISTS[3]]:[]});
  const [chemDefaults,setChemDefaults]   = useLocalStorage("spraylog_chem",  DEFAULT_CHEM);
  const [completedLogs,setCompletedLogs] = useLocalStorage("spraylog_logs",  []);
  const totalJobs = Object.values(jobLists).flat().length;

  return (
    <div style={{minHeight:"100vh",background:"#f2f5ee",fontFamily:"Georgia,serif"}}>
      <div style={{background:"#2d5a1b",padding:"14px 28px",display:"flex",alignItems:"center",gap:14}}>
        <span style={{fontSize:26}}>🌿</span>
        <div>
          <div style={{color:"#fff",fontSize:17,fontWeight:700}}>Spray Log Generator</div>
          <div style={{color:"#b5d4a0",fontSize:11}}>City of Tulsa / Stormwater Maintenance — Hydromulch Plus of Oklahoma</div>
        </div>
        <div style={{marginLeft:"auto",display:"flex",gap:16,fontSize:12,color:"#b5d4a0"}}>
          <span>📋 {totalJobs} jobs</span>
          <span>📄 {completedLogs.length} saved</span>
        </div>
      </div>
      <div style={{maxWidth:980,margin:"24px auto",padding:"0 16px"}}>
        <Tabs tabs={["Jobs","Upload","Saved Logs","Chemicals"]} active={tab} onChange={setTab}/>
        <div style={{background:"#fff",borderRadius:10,padding:26,boxShadow:"0 2px 12px rgba(0,0,0,.07)"}}>
          {tab==="Jobs"       && <JobsTab jobLists={jobLists} chemDefaults={chemDefaults} completedLogs={completedLogs} setCompletedLogs={setCompletedLogs}/>}
          {tab==="Upload"     && <UploadTab jobLists={jobLists} setJobLists={setJobLists}/>}
          {tab==="Saved Logs" && <LogsTab completedLogs={completedLogs} setCompletedLogs={setCompletedLogs}/>}
          {tab==="Chemicals"  && <ChemTab chemDefaults={chemDefaults} setChemDefaults={setChemDefaults}/>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
